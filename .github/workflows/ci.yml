name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm exec stylelint "apps/**/*.scss" --allow-empty-input
      - run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  # apps/parsers не входит в pnpm/turbo пайплайн (это отдельный Gradle-проект), поэтому
  # компиляция сайдкара иначе не проверялась вообще ни в одном CI-джобе. Сетевые
  # контрактные тесты (bin по живым сайтам) намеренно не гоняются здесь — только в
  # parsers-nightly.yml — чтобы PR не зависели от доступности внешних сайтов.
  parsers-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileKotlin compileTestKotlin --no-daemon
