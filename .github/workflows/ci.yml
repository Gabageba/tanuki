name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm exec stylelint "apps/**/*.scss" --allow-empty-input
      - run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  # Юнит- и фикстурные тесты (packages/parsers, apps/api). Живые контрактные тесты источников
  # (реальные запросы к сайтам) намеренно не гоняются здесь — только в parsers-nightly.yml —
  # чтобы PR не зависели от доступности внешних сайтов.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  # Визуальные тесты историй Storybook (apps/web/visual): снимки сверяются с эталонами из git.
  # Образ — тот же, что у `pnpm test:visual`; его версия совпадает с @playwright/test в apps/web.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@tanuki/contracts
      - run: pnpm --filter @tanuki/web storybook:build
      - run: pnpm --filter @tanuki/web exec playwright test -c visual
      # Отчёт с диффами: что именно съехало и на каких историях.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: apps/web/visual/report
          retention-days: 14
