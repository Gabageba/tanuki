name: CI

on:
  workflow_call:
    inputs:
      full:
        description: Run every release check without change selection
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full:
        description: Run all checks
        type: boolean
        default: true
  pull_request:
  merge_group:
  push:
    branches: [master, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select checks (release tags always run everything)
        id: plan
        env:
          CHECKS_FULL: ${{ inputs.full == true || startsWith(github.ref, 'refs/tags/') }}
          CHECKS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHECKS_HEAD: ${{ github.sha }}
        run: node scripts/checks/run.mjs --plan

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm exec stylelint "apps/**/*.scss" --allow-empty-input
      - run: pnpm exec prettier --check .
      - run: pnpm lint:i18n

  typecheck:
    needs: changes
    # Preserve required check names even when no expensive work is selected.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CHECKS_PLAN: ${{ needs.changes.outputs.plan }}
      CHECKS_PLAN_RESULT: ${{ needs.changes.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether this check is affected
        id: selection
        run: node scripts/checks/run.mjs --task typecheck --status
      - run: pnpm install --frozen-lockfile
        if: steps.selection.outputs.run == 'true'
      - run: node scripts/checks/run.mjs --task typecheck
        if: steps.selection.outputs.run == 'true'

  build:
    needs: changes
    # Preserve required check names even when no expensive work is selected.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CHECKS_PLAN: ${{ needs.changes.outputs.plan }}
      CHECKS_PLAN_RESULT: ${{ needs.changes.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether this check is affected
        id: selection
        run: node scripts/checks/run.mjs --task build --status
      - run: pnpm install --frozen-lockfile
        if: steps.selection.outputs.run == 'true'
      - run: node scripts/checks/run.mjs --task build
        if: steps.selection.outputs.run == 'true'

  # Live source contract tests remain in parsers-nightly.yml, outside release/PR checks.
  test:
    needs: changes
    # Preserve required check names even when no expensive work is selected.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CHECKS_PLAN: ${{ needs.changes.outputs.plan }}
      CHECKS_PLAN_RESULT: ${{ needs.changes.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether this check is affected
        id: selection
        run: node scripts/checks/run.mjs --task test --status
      - run: pnpm install --frozen-lockfile
        if: steps.selection.outputs.run == 'true'
      - run: node scripts/checks/run.mjs --task test
        if: steps.selection.outputs.run == 'true'

  # Docker is started only when visual checks are selected, using the same image locally and in CI.
  visual:
    needs: changes
    # Preserve required check names even when no expensive work is selected.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CHECKS_PLAN: ${{ needs.changes.outputs.plan }}
      CHECKS_PLAN_RESULT: ${{ needs.changes.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether this check is affected
        id: selection
        run: node scripts/checks/run.mjs --task visual --status
      - run: pnpm install --frozen-lockfile
        if: steps.selection.outputs.run == 'true'
      - run: node scripts/checks/run.mjs --task visual
        if: steps.selection.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: apps/web/visual/report
          retention-days: 14

  e2e:
    needs: changes
    # Preserve required check names even when no expensive work is selected.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CHECKS_PLAN: ${{ needs.changes.outputs.plan }}
      CHECKS_PLAN_RESULT: ${{ needs.changes.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether this check is affected
        id: selection
        run: node scripts/checks/run.mjs --task e2e --status
      - run: pnpm install --frozen-lockfile
        if: steps.selection.outputs.run == 'true'
      - run: node scripts/checks/run.mjs --task e2e
        if: steps.selection.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/e2e/report
            apps/web/e2e/test-results
            tests/e2e/report
          retention-days: 14
