name: Temporary Inuko formatter
on:
  push:
    branches: [fix/inuko-ssr-library-import]
    paths:
      - .github/workflows/format-inuko.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inuko-ssr-library-import
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/parsers/src/sources/inuko/library.ts packages/parsers/test/inuko.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/parsers/src/sources/inuko/library.ts packages/parsers/test/inuko.test.ts
          git diff --cached --quiet || git commit -m "style(inuko): apply project Prettier formatting"
          git push origin HEAD:fix/inuko-ssr-library-import
