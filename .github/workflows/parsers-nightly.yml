name: Parsers nightly contract tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

# OAuth refresh tokens rotate on use; two runs must not spend the same stored token.
concurrency:
  group: parsers-nightly-tokens
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    # Environment secrets are read when the job starts, after waiting for concurrency.
    environment: parsers-nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@tanuki/parsers
      # Environment tokens override repository tokens, which seed the first run only.
      # File names must match SOURCE_ID values (lowercase, including on Linux).
      - name: Set up LibSocial token stores
        run: |
          mkdir -p "$RUNNER_TEMP/libsocial-tokens"
          if [ -n "$LIBSOCIAL_MANGALIB_TOKEN" ]; then
            printf '%s' "$LIBSOCIAL_MANGALIB_TOKEN" > "$RUNNER_TEMP/libsocial-tokens/mangalib.json"
          fi
          if [ -n "$LIBSOCIAL_HENTAILIB_TOKEN" ]; then
            printf '%s' "$LIBSOCIAL_HENTAILIB_TOKEN" > "$RUNNER_TEMP/libsocial-tokens/hentailib.json"
          fi
        env:
          LIBSOCIAL_MANGALIB_TOKEN: ${{ secrets.LIBSOCIAL_MANGALIB_TOKEN }}
          LIBSOCIAL_HENTAILIB_TOKEN: ${{ secrets.LIBSOCIAL_HENTAILIB_TOKEN }}
      - run: pnpm --filter @tanuki/parsers test:contract
        env:
          GROUPLE_USERNAME: ${{ secrets.GROUPLE_USERNAME }}
          GROUPLE_PASSWORD: ${{ secrets.GROUPLE_PASSWORD }}
          ALLHENTAI_USERNAME: ${{ secrets.ALLHENTAI_USERNAME }}
          ALLHENTAI_PASSWORD: ${{ secrets.ALLHENTAI_PASSWORD }}
          LIBSOCIAL_TOKEN_STORE_DIR: ${{ runner.temp }}/libsocial-tokens
      # Save both rotated tokens even when another source fails. GITHUB_TOKEN cannot write
      # environment secrets; GH_SECRETS_PAT supplies that permission.
      - name: Persist LibSocial tokens
        if: always()
        run: |
          status=0
          for source in mangalib hentailib; do
            token_file="$RUNNER_TEMP/libsocial-tokens/$source.json"
            if [ -s "$token_file" ]; then
              gh secret set "LIBSOCIAL_${source^^}_TOKEN" --env parsers-nightly < "$token_file" || status=1
            fi
          done
          exit "$status"
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parsers-contract-test-report
          path: packages/parsers/contract-report.json
          if-no-files-found: ignore
