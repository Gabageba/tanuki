packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: false
  # postinstall msw только копирует воркер в public — он уже лежит в apps/web/.storybook/public.
  msw: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - '@vitejs/plugin-react-swc@4.3.3'
  - fastify@5.11.0
  - vite@8.2.0
