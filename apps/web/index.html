<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Фон тёмной темы, как theme_color в манифесте (vite.config.ts): CSS ещё не загружен. -->
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Tanuki</title>
    <script>
      // Выставляем схему до первой отрисовки, иначе у пользователя с тёмной темой
      // успевает моргнуть светлый фон. Ключ и значение по умолчанию продублированы
      // из src/shared/lib/settings.ts и src/app/Providers/models.ts.
      (function () {
        try {
          var raw = window.localStorage.getItem('tanuki-settings');
          var stored = raw ? JSON.parse(raw).colorScheme : null;
          var scheme =
            stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto';
          var computed =
            scheme !== 'auto'
              ? scheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', computed);
        } catch (error) {
          // localStorage может быть недоступен (приватный режим) — тогда схему выставит Mantine.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
