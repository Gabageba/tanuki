services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tanuki
      POSTGRES_PASSWORD: tanuki
      POSTGRES_DB: tanuki
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Ловит письма подтверждения почты и сброса пароля в dev — ничего никуда реально не уходит.
  # UI на http://localhost:8025, SMTP на 1025 (см. SMTP_HOST/SMTP_PORT в apps/api/.env.example).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  valkey-data:
  postgres-data:
