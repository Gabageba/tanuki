name: ${COMPOSE_PROJECT_NAME:-tanuki}

x-api: &api
  image: ${API_IMAGE:?Укажите API_IMAGE из релиза или локальной сборки}
  env_file:
    - .env
    - path: api.env
      format: raw
  environment:
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgres://tanuki:${POSTGRES_PASSWORD:?Задайте пароль БД}@postgres:5432/tanuki
    REDIS_URL: redis://valkey:6379
    TRUST_PROXY: ${TANUKI_SUBNET_PREFIX:-172.30.98}.3/32
    LIBSOCIAL_TOKEN_STORE_DIR: /data/libsocial-tokens
  networks:
    default: {}
  volumes:
    - ./data/libsocial-tokens:/data/libsocial-tokens

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanuki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте пароль БД}
      POSTGRES_DB: tanuki
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'tanuki', '-d', 'tanuki']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api
    command: ['node', 'dist-cli/scripts/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${TANUKI_SUBNET_PREFIX:-172.30.98}.4
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  web:
    image: ${WEB_IMAGE:?Укажите WEB_IMAGE из релиза или локальной сборки}
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:-localhost}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
      SENTRY_WEB_DSN: ${SENTRY_WEB_DSN:-}
      TANUKI_VERSION: ${TANUKI_VERSION:-development}
    networks:
      default:
        ipv4_address: ${TANUKI_SUBNET_PREFIX:-172.30.98}.3
    ports:
      - '${WEB_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080'
      - '${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/health']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [local]
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

networks:
  default:
    ipam:
      config:
        - subnet: ${TANUKI_SUBNET_PREFIX:-172.30.98}.0/24
          ip_range: ${TANUKI_SUBNET_PREFIX:-172.30.98}.128/25

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
