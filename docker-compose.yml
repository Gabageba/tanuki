services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tanuki
      POSTGRES_PASSWORD: tanuki
      POSTGRES_DB: tanuki
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # JVM-сайдкар парсеров (docs/03-parsers.md). В проде слушает только внутреннюю сеть
  # докера — порт публикуется наружу только ради удобства локальной разработки, пока
  # apps/api запускается через `pnpm dev`, а не в compose.
  parsers:
    build: ./apps/parsers
    ports:
      - '8085:8080'

volumes:
  valkey-data:
  postgres-data:
